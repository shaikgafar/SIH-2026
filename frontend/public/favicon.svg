<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="moonGrad" cx="36%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="35%" stop-color="#cbd5e1" />
      <stop offset="70%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#1e293b" />
    </radialGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <filter id="moonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#38bdf8" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Outer Glow Ring -->
  <circle cx="32" cy="32" r="30" fill="url(#glowGrad)" />
  <!-- Moon Sphere -->
  <circle cx="32" cy="32" r="23" fill="url(#moonGrad)" filter="url(#moonGlow)" />
  <!-- Lunar Maria & Craters -->
  <ellipse cx="39" cy="23" rx="6.5" ry="4.8" fill="#334155" opacity="0.45" />
  <ellipse cx="37" cy="35" rx="7.2" ry="5.2" fill="#334155" opacity="0.42" />
  <circle cx="22" cy="25" r="4.2" fill="#475569" opacity="0.58" />
  <circle cx="21" cy="24" r="2.2" fill="#1e293b" opacity="0.75" />
  <circle cx="25" cy="43" r="3.2" fill="#334155" opacity="0.65" />
  <circle cx="24.2" cy="42.2" r="1.5" fill="#1e293b" opacity="0.8" />
  <circle cx="33" cy="18" r="1.8" fill="#475569" opacity="0.5" />
  <circle cx="43" cy="42" r="2.2" fill="#334155" opacity="0.55" />
  <circle cx="29" cy="34" r="1.5" fill="#475569" opacity="0.6" />
</svg>